name: 데이터 수집·집계 (일정·기록 증분)

# 일정 증분 + 신규 경기 기록만 — 하루 여러 번 가볍게 돈다.
# 선수현황(로스터/팀)은 별도 워크플로(teams.yml, 하루 2회)로 분리.
# 전체 월 재스캔은 scrape-full.yml (수동 전용).

on:
  schedule:
    # UTC 기준 (KST = UTC+9): 12:00 / 15:00 / 18:00 / 21:00 / 24:00 KST
    - cron: "0 3,6,9,12,15 * * *"
  workflow_dispatch: # 수동 실행

permissions:
  contents: write # data/ 커밋용

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # 큐잉 시점 커밋이 아닌 실행 시점의 최신 main (연달아 실행 시 push 충돌 방지)

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: scraper/package-lock.json

      - name: Install
        working-directory: scraper
        run: npm ci

      # 모든 증분 수집 명령에 실행 시점 KST 연도를 명시한다.
      # scraper도 같은 값을 재검증하여 과거 아카이브 오수집을 차단한다.
      - name: Set collection year (KST)
        run: |
          echo "YEAR=$(TZ=Asia/Seoul date +%Y)" >> "$GITHUB_ENV"
          echo "수집 연도: $(TZ=Asia/Seoul date +%Y)"

      # 경기일정 페이지용 일정/결과 데이터 (data/{year}/schedule.json — 증분)
      - name: Refresh schedule (경기일정 — 증분)
        working-directory: scraper
        run: npm run schedule

      # 신규 경기 수집 → 신규 선수 공식기록 증분 수집 → 재집계 (마지막 갱신 이후만)
      - name: Scrape new games & re-aggregate
        working-directory: scraper
        run: npm run scrape

      - name: Commit data changes
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(data): 일정·기록 증분 $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main # 수집 중 다른 push가 있었으면 그 위로 재적용
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
